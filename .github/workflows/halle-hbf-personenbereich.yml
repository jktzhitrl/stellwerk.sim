name: Halle Personenbahnhof mit Abstellung – OSM-Originaldaten
on:
  push:
    branches:
      - chatgpt/halle-hbf-personenbahnhof-abstellung-20261120
    paths:
      - 'halle-hbf-personenbereich.mjs'
      - 'tools/halle-hbf-scope.mjs'
      - 'tools/tests/halle-hbf-personenbereich.test.mjs'
      - '.github/workflows/halle-hbf-personenbereich.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  scoped-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm correct scope and OSM topology
        run: |
          node --test tools/tests/halle-hbf-personenbereich.test.mjs tools/tests/halle-hbf-import.test.mjs
          node --check halle-hbf-personenbereich.mjs
      - name: Obtain dated original OSM snapshot for reproducible subset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p review-data
          if gh run download 44697217699 -R jktzhitrl/stellwerk.sim -n halle-hbf-osm-raw-and-review -D review-data; then
            echo "Reusing the checked 20-Nov-2026 OSM snapshot"
          else
            echo "Prior artifact expired; retrying Overpass/primary OSM API"
            success=0
            for host in 'https://overpass.private.coffee/api/interpreter' 'https://overpass-api.de/api/interpreter'; do
              if curl --fail --show-error --silent --location --connect-timeout 12 --max-time 80 \
                   --user-agent 'Stellwerk.sim Halle passenger station audit' \
                   --request POST --data-urlencode 'data@docs/halle-hbf-openrailwaymap-overpass.ql' \
                   "$host" -o review-data/halle-hbf-overpass.json; then
                if node -e "const o=require('./review-data/halle-hbf-overpass.json');if(!Array.isArray(o.elements)||o.elements.length<10)process.exit(1)"; then
                  success=1
                  break
                fi
              fi
            done
            if [ "$success" != 1 ]; then
              curl --fail --show-error --silent --location --max-time 120 \
                --user-agent 'Stellwerk.sim Halle passenger station audit' \
                'https://api.openstreetmap.org/api/0.6/map?bbox=11.971,51.467,12.014,51.490' \
                -o review-data/halle-hbf-map.osm
              python3 tools/halle-hbf-osm-xml-to-json.py review-data/halle-hbf-map.osm review-data/halle-hbf-overpass.json
            fi
            node tools/halle-hbf-import.mjs review-data/halle-hbf-overpass.json review-data/halle-hbf-osm-review.json
          fi
          node -e "const a=require('./review-data/halle-hbf-osm-review.json');if(a.tracks.length<1000)throw Error('Incomplete railway map')"
      - name: Extract ONLY passenger tracks, stabling and existing OSM connector ways
        run: node tools/halle-hbf-scope.mjs review-data/halle-hbf-overpass.json review-data/halle-hbf-osm-review.json review-data/halle-hbf-personenbereich.json
      - name: Save independently labeled scoped dataset on development branch
        shell: bash
        run: |
          git fetch origin chatgpt/halle-hbf-personenbahnhof-abstellung-20261120
          git rebase origin/chatgpt/halle-hbf-personenbahnhof-abstellung-20261120
          mkdir -p data
          cp review-data/halle-hbf-personenbereich.json data/halle-hbf-personenbereich.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/halle-hbf-personenbereich.json
          if ! git diff --cached --quiet; then
            git commit -m "Scope Halle Hbf original OSM passenger tracks and Kasseler stabling"
            git push origin HEAD:chatgpt/halle-hbf-personenbahnhof-abstellung-20261120
          fi
      - name: Upload scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halle-hbf-personenbahnhof-mit-abstellung
          path: review-data/halle-hbf-personenbereich.json
          if-no-files-found: warn
          retention-days: 14
