name: Halle Hbf routing regression tests
on:
  push:
    branches:
      - chatgpt/halle-hbf-better-routing-20261120
    paths:
      - 'halle-hbf-routing.mjs'
      - 'halle-hbf-play.html'
      - 'tools/tests/halle-hbf-routing.test.mjs'
      - '.github/workflows/halle-hbf-routing-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node.js version
        run: node --version
      - name: Routing unit tests
        run: node --test tools/tests/halle-hbf-routing.test.mjs
      - name: JS syntax
        run: |
          node --check halle-hbf-routing.mjs
          node -e "const fs=require('fs');let html=fs.readFileSync('halle-hbf-play.html','utf8');new Function(html.slice(html.lastIndexOf('<script>')+8,html.lastIndexOf('</script>')));"
