name: Halle east/west and shunting sector tests
on:
  push:
    branches:
      - chatgpt/halle-east-west-shunting-20261120
      - gh-pages
    paths:
      - 'halle-hbf-bereiche.mjs'
      - 'halle-hbf-play.html'
      - 'halle-hbf-routing.mjs'
      - 'data/halle-hbf-personenbereich.json'
      - 'tools/tests/halle-hbf-bereiche.test.mjs'
      - '.github/workflows/halle-hbf-bereiche-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --check halle-hbf-bereiche.mjs
      - run: node --test tools/tests/halle-hbf-bereiche.test.mjs tools/tests/halle-hbf-spielmodus.test.mjs
      - name: Check Android offline bundle includes the area controller
        run: |
          node android-app/scripts/prepare-web.mjs
          test -f android-app/www/halle-hbf-bereiche.mjs
          test -f android-app/www/halle-hbf-play.html
