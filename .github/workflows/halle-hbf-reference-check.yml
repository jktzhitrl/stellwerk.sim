name: Halle Hbf platform and direction reference checks
on:
  push:
    branches:
      - gh-pages
      - chatgpt/halle-hbf-platform-directions-20261120
    paths:
      - 'halle-hbf-play.html'
      - 'halle-hbf-references.mjs'
      - 'halle-hbf-routing.mjs'
      - 'data/halle-hbf-osm-review.json'
      - 'tools/tests/halle-hbf-references.test.mjs'
      - '.github/workflows/halle-hbf-reference-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Halle references and geometry source
        run: node --test tools/tests/halle-hbf-references.test.mjs tools/tests/halle-hbf-routing.test.mjs
      - name: Validate JavaScript and in-page script syntax
        run: |
          node --check halle-hbf-references.mjs
          node --check halle-hbf-routing.mjs
          node -e "const fs=require('fs');const html=fs.readFileSync('halle-hbf-play.html','utf8');new Function(html.slice(html.lastIndexOf('<script>')+8,html.lastIndexOf('</script>')))"
