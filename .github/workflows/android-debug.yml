name: Android Debug APK (Stellwerk.sim)

on:
  push:
    branches: [gh-pages]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'editor.html'
      - 'custom-play.html'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout game sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Package local Stellwerk HTML and assets
        run: npm run prepare:web

      - name: Generate Android project and sync bundled game
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK (signed with Android's debug key)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: stellwerk-sim-android-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
