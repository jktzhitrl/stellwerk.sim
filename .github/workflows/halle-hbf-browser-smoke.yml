name: Halle browser start and train smoke test
on:
  push:
    branches:
      - chatgpt/halle-remove-locked-and-fix-start-20261120
      - gh-pages
    paths:
      - 'index.html'
      - 'halle-hbf-play.html'
      - 'halle-hbf-betrieb.mjs'
      - 'tools/tests/halle-hbf-browser-smoke.mjs'
      - '.github/workflows/halle-hbf-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve files and check real game in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/halle-test-http.log 2>&1 &
          sleep 2
          node tools/tests/halle-hbf-browser-smoke.mjs
