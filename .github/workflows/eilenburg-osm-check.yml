name: Eilenburg OSM topology data check

on:
  push:
    branches:
      - chatgpt/eilenburg-db-track-layout-20261119
    paths:
      - 'tools/eilenburg-import.mjs'
      - 'tools/tests/eilenburg-import.test.mjs'
      - 'docs/eilenburg-openrailwaymap-overpass.ql'
      - '.github/workflows/eilenburg-osm-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4

      - name: Node.js version
        run: node --version

      - name: Regression tests for OSM node identity and turnouts
        run: node --test tools/tests/eilenburg-import.test.mjs

      - name: Request current OpenStreetMap railway data via Overpass
        shell: bash
        run: |
          mkdir -p review-data
          curl --fail --show-error --silent --location \
            --max-time 180 --retry 2 --retry-delay 8 \
            --request POST \
            --data-urlencode 'data@docs/eilenburg-openrailwaymap-overpass.ql' \
            'https://overpass-api.de/api/interpreter' \
            --output review-data/eilenburg-overpass.json
          node -e "const o=require('./review-data/eilenburg-overpass.json');if(!Array.isArray(o.elements)||o.elements.length<10)process.exit(1);console.log('Received '+o.elements.length+' OSM elements')"

      - name: Convert exact OSM nodes into review dataset
        run: node tools/eilenburg-import.mjs review-data/eilenburg-overpass.json review-data/eilenburg-osm-review.json

      - name: Upload review data (not automatically published as game geometry)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eilenburg-osm-raw-and-review
          path: review-data/
          if-no-files-found: warn
          retention-days: 14
