name: Halle Hbf OSM object audit tests
on:
  push:
    branches:
      - gh-pages
      - chatgpt/halle-hbf-signals-switches-audit-20261120
    paths:
      - 'halle-hbf-objects.mjs'
      - 'halle-hbf-play.html'
      - 'tools/tests/halle-hbf-objects.test.mjs'
      - '.github/workflows/halle-hbf-object-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Routing, reference and object classification tests
        run: node --test tools/tests/halle-hbf-routing.test.mjs tools/tests/halle-hbf-references.test.mjs tools/tests/halle-hbf-objects.test.mjs
      - name: Browser-script and module syntax
        run: |
          node --check halle-hbf-objects.mjs
          node --check halle-hbf-routing.mjs
          node --check halle-hbf-references.mjs
          node -e "const fs=require('fs');const h=fs.readFileSync('halle-hbf-play.html','utf8');new Function(h.slice(h.lastIndexOf('<script>')+8,h.lastIndexOf('</script>')))"
